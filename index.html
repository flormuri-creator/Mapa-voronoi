<!--<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeo Digital - Diagrama de Voronoi interactivo</title>
    <style>

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            padding: 20px;

            display: flex;

            margin-bottom: 20px;

            position: relative;
            width: 100%;
            overflow: hidden;
            border: 2px solid #ddd;

</head>
<body>

<div class="container">
    <h1>5. Mapeo Digital Interactiva (Prototipo)</h1>
    <p class="instructions">
        <strong>¿Cómo funciona?</strong> Pon una dirección ficticia (por ejemplo: "Puebla", "Oaxaca", "Veracruz" o coordenadas X,Y entre 0 y 800) o simplemente <strong>haz clic en cualquier parte del mapa</strong> para buscar la torre de alerta sísmica más cercana.
    </p>

    <div class="search-box">
        <input type="text" id="address-input" placeholder="Escribe una zona, estado de México o coordenadas (ej: 400, 250)...">
        <button onclick="searchLocation()">Buscar punto cercano</button>
    </div>

    <div id="canvas-container">
        <canvas id="voronoiCanvas" width="800" height="450"></canvas>
    </div>

    <div class="info-panel" id="result-panel">
        <strong>Estado del sistema:</strong> Esperando interacción. Haz clic en el mapa para ubicar tu posición.
    </div>
</div>

<script>
    const canvas = document.getElementById('voronoiCanvas');
    const ctx = canvas.getContext('2d');

    // Torres de alerta simuladas (Puntos de control del Voronoi) basados en tu mapa de México
    const torres = [
        { id: 1, name: "Torre Michoacán", x: 180, y: 280, color: "#f9e79f" },
        { id: 2, name: "Torre Guerrero", x: 260, y: 340, color: "#f5b7b1" },
        { id: 3, name: "Torre Puebla", x: 340, y: 260, color: "#d5f5e3" },
        { id: 4, name: "Torre Veracruz Norte", x: 420, y: 210, color: "#e8daef" },
        { id: 5, name: "Torre Oaxaca Centro", x: 410, y: 330, color: "#f5cbf7" },
        { id: 6, name: "Torre Veracruz Sur", x: 500, y: 290, color: "#fdebd0" },
        { id: 7, name: "Torre Chiapas", x: 620, y: 360, color: "#d6eaf8" }
    ];

    let userLocation = null;

    // Función para renderizar dinámicamente las regiones de Voronoi píxel por píxel
    function drawVoronoi() {
        const width = canvas.width;
        const height = canvas.height;
        const imgData = ctx.createImageData(width, height);

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                // Para cada píxel, buscamos la torre más cercana
                let minDist = Infinity;
                let closestTorre = torres[0];

                for (let t of torres) {
                    let d = Math.hypot(x - t.x, y - t.y);
                    if (d < minDist) {
                        minDist = d;
                        closestTorre = t;
                    }
                }

                // Convertir color HEX a RGB para pintar la celda
                let rgb = hexToRgb(closestTorre.color);
                let idx = (y * width + x) * 4;
                imgData.data[idx] = rgb.r;
                imgData.data[idx+1] = rgb.g;
                imgData.data[idx+2] = rgb.b;
                imgData.data[idx+3] = 255; // Opacidad
            }
        }
        ctx.putImageData(imgData, 0, 0);

        // Dibujar las líneas de la costa/tierra de forma muy abstracta y estilizada
        ctx.fillStyle = "#333";
        ctx.font = "16px sans-serif";
        ctx.fillText("Golfo de México", 450, 100);
        ctx.fillText("Océano Pacífico", 80, 400);

        // Dibujar las torres físicas en el mapa
        torres.forEach(t => {
            ctx.beginPath();
            ctx.arc(t.x, t.y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = "#ff0000";
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 11px Arial";
            ctx.fillText(t.name, t.x - 30, t.y - 12);
        });

        // Dibujar el punto del usuario si existe
        if (userLocation) {
            ctx.beginPath();
            ctx.arc(userLocation.x, userLocation.y, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "#0000ff";
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            // Línea de conexión a la torre más cercana
            ctx.beginPath();
            ctx.moveTo(userLocation.x, userLocation.y);
            ctx.lineTo(userLocation.closest.x, userLocation.closest.y);
            ctx.strokeStyle = "#0000ff";
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }
    }

    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : {r: 0, g: 0, b: 0};
    }

    // Calcular matemáticamente el vecino más cercano (Algoritmo Voronoi de búsqueda directa)
    function findClosestTorre(x, y) {
        let minD = Infinity;
        let closest = null;
        torres.forEach(t => {
            let d = Math.hypot(x - t.x, y - t.y);
            if (d < minD) {
                minD = d;
                closest = t;
            }
        });
        return { closest, distance: Math.round(minD) };
    }

    // Interacción por Click
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const res = findClosestTorre(x, y);
        userLocation = { x, y, closest: res.closest };
        
        drawVoronoi();
        document.getElementById('result-panel').innerHTML = `
            <strong>📍 Ubicación seleccionada:</strong> Coordenadas (${Math.round(x)}, ${Math.round(y)})<br>
            <strong>🚨 Torre sísmica asignada (Más cercana):</strong> <span style="color:#d9534f; font-weight:bold;">${res.closest.name}</span><br>
            <strong>📏 Distancia geométrica relativa:</strong> ${res.distance} unidades métricas.
        `;
    });

    // Simulación del cuadro de búsqueda de direcciones
    function searchLocation() {
        const input = document.getElementById('address-input').value.toLowerCase();
        let targetX = 400, targetY = 250; // por defecto centro

        if (input.includes("puebla")) { targetX = 350; targetY = 250; }
        else if (input.includes("oaxaca")) { targetX = 420; targetY = 340; }
        else if (input.includes("veracruz")) { targetX = 480; targetY = 260; }
        else if (input.includes("chiapas")) { targetX = 640; targetY = 350; }
        else if (input.includes("guerrero")) { targetX = 270; targetY = 330; }
        else if (input.includes("michoacan") || input.includes("michoacán")) { targetX = 190; targetY = 270; }
        else if (input.split(',').length === 2) {
            const coords = input.split(',');
            targetX = parseFloat(coords[0]) || 400;
            targetY = parseFloat(coords[1]) || 250;
        }

        const res = findClosestTorre(targetX, targetY);
        userLocation = { x: targetX, y: targetY, closest: res.closest };
        drawVoronoi();
        
        document.getElementById('result-panel').innerHTML = `
            <strong>🔍 Dirección/Zona interpretada:</strong> "${document.getElementById('address-input').value}" asignada a la zona pixel (${targetX}, ${targetY})<br>
            <strong>🚨 Torre sísmica asignada (Más cercana):</strong> <span style="color:#d9534f; font-weight:bold;">${res.closest.name}</span><br>
            <strong>📏 Distancia geométrica aproximada:</strong> ${res.distance} unidades.
        `;
    }

    // Inicializar mapa
    drawVoronoi();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Sensores Sísmicos y Diagrama de Voronoi</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; display: flex; flex-direction: column; }
    
    #header {
      padding: 15px;
      background: #1f2937;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #search-input {
      flex: 1;
      min-width: 250px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #1d4ed8; }

    #info-panel {
      padding: 10px 15px;
      background: #374151;
      color: #e5e7eb;
      width: 100%;
      font-size: 14px;
    }

    #map { flex: 1; width: 100%; z-index: 1; }
  </style>
</head>
<body>

  <div id="header">
    <h3 style="margin: 0 10px 0 0;">Sensores SASMEX (Voronoi)</h3>
    <input type="text" id="search-input" placeholder="Ingresa una dirección en México (ej. Av. Reforma, CDMX o Acapulco)">
    <button onclick="buscarDireccion()">Buscar Dirección</button>
  </div>

  <div id="info-panel">
    <span id="resultado">Ingresa una ubicación para calcular el sensor sísmico en servicio más cercano.</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Turf.js (Para cálculos geométricos y Diagrama de Voronoi) -->
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    // 1. Inicializar el mapa centrado en el sur/centro de México
    const map = L.map('map').setView([17.5, -99.5], 6);

    // Agregar capa del mapa (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors | SASMEX'
    }).addTo(map);

    // 2. Coordenadas aproximadas de los sensores sísmicos en servicio (SASMEX)
    // Red de cobertura en la costa del Pacífico (Jalisco, Michoacán, Guerrero, Oaxaca) y zona central (Puebla, Morelos).
    const sensoresData = [
      { id: "S01", nombre: "Sensor Puerto Vallarta", lat: 20.6534, lng: -105.2253 },
      { id: "S02", nombre: "Sensor El Grullo", lat: 19.8055, lng: -104.2178 },
      { id: "S03", nombre: "Sensor Manzanillo", lat: 19.0522, lng: -104.3158 },
      { id: "S04", nombre: "Sensor Tecomán", lat: 18.9125, lng: -103.8742 },
      { id: "S05", nombre: "Sensor Coahuayana", lat: 18.7521, lng: -103.6741 },
      { id: "S06", nombre: "Sensor Lázaro Cárdenas", lat: 17.9583, lng: -102.1965 },
      { id: "S07", nombre: "Sensor Zihuatanejo", lat: 17.6413, lng: -101.5516 },
      { id: "S08", nombre: "Sensor Tecpan", lat: 17.2215, lng: -100.6321 },
      { id: "S09", nombre: "Sensor Atoyac", lat: 17.2081, lng: -100.4352 },
      { id: "S10", nombre: "Sensor Coyuca", lat: 17.0094, lng: -100.0883 },
      { id: "S11", nombre: "Sensor Acapulco", lat: 16.8531, lng: -99.8237 },
      { id: "S12", nombre: "Sensor San Marcos", lat: 16.7912, lng: -99.3941 },
      { id: "S13", nombre: "Sensor Ometepec", lat: 16.6847, lng: -98.4168 },
      { id: "S14", nombre: "Sensor Pinotepa Nacional", lat: 16.3421, lng: -98.0543 },
      { id: "S15", nombre: "Sensor Puerto Escondido", lat: 15.8617, lng: -97.0654 },
      { id: "S16", nombre: "Sensor Huatulco", lat: 15.7725, lng: -96.1287 },
      { id: "S17", nombre: "Sensor Salina Cruz", lat: 16.1812, lng: -95.1983 },
      { id: "S18", nombre: "Sensor Tehuacán", lat: 18.4631, lng: -97.3931 },
      { id: "S19", nombre: "Sensor Huajuapan de León", lat: 17.8083, lng: -97.7761 },
      { id: "S20", nombre: "Sensor Cuernavaca", lat: 18.9261, lng: -99.2308 },
      { id: "S21", nombre: "Sensor Izúcar de Matamoros", lat: 18.6014, lng: -98.4632 }
    ];

    let userMarker = null;

    // 3. Crear FeatureCollection de GeoJSON para Turf.js
    const pointsGeoJSON = turf.featureCollection(
      sensoresData.map(s => turf.point([s.lng, s.lat], { nombre: s.nombre, id: s.id }))
    );

    // 4. Generar polígonos de Voronoi
    // Definir un rectángulo que envuelva la zona de cobertura sísmica
    const bbox = [-107.0, 14.0, -93.0, 22.0];
    const voronoiPolygons = turf.voronoi(pointsGeoJSON, { bbox: bbox });

    // Dibujar la capa de Voronoi en el mapa
    L.geoJSON(voronoiPolygons, {
      style: {
        color: '#2563eb',
        weight: 1.5,
        fillColor: '#60a5fa',
        fillOpacity: 0.15
      }
    }).addTo(map);

    // 5. Agregar marcadores para los sensores en servicio
    sensoresData.forEach(sensor => {
      L.circleMarker([sensor.lat, sensor.lng], {
        radius: 6,
        color: '#dc2626',
        fillColor: '#ef4444',
        fillOpacity: 0.9
      })
      .bindPopup(`<b>${sensor.nombre}</b><br>Estado: En servicio`)
      .addTo(map);
    });

    // 6. Función para buscar direcciones mediante Nominatim API (Geocoding)
    async function buscarDireccion() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Mexico')}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.length === 0) {
          alert("No se encontró la dirección. Intenta especificar más detalles (ej. ciudad o estado).");
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);
        const searchPoint = turf.point([lng, lat]);

        // Mover el mapa a la posición encontrada
        map.setView([lat, lng], 11);

        // Quitar marcador previo si existe
        if (userMarker) map.removeLayer(userMarker);

        // Crear nuevo marcador para la posición buscada
        userMarker = L.marker([lat, lng]).addTo(map)
          .bindPopup(`<b>Ubicación buscada:</b><br>${data[0].display_name}`)
          .openPopup();

        // 7. Encontrar el sensor más cercano mediante Turf.js (Nearest Point)
        const nearest = turf.nearestPoint(searchPoint, pointsGeoJSON);
        const distKm = turf.distance(searchPoint, nearest, { units: 'kilometers' }).toFixed(2);

        // Mostrar resultado en pantalla
        document.getElementById('resultado').innerHTML = 
          `📍 <b>Sensor más cercano:</b> ${nearest.properties.nombre} | 📏 <b>Distancia:</b> ${distKm} km`;

      } catch (error) {
        console.error("Error al buscar la dirección:", error);
        alert("Ocurrió un error al realizar la búsqueda.");
      }
    }
  </script>
</body>
</html>
