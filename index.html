<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voronoi SASMEX - GitHub Pages</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; display: flex; flex-direction: column; }
    
    #header {
      padding: 12px 20px;
      background: #111827;
      color: white;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    #search-input {
      flex: 1;
      max-width: 450px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 14px;
    }

    #search-input::placeholder { color: #9ca3af; }

    button {
      padding: 10px 16px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover { background: #1d4ed8; }

    .btn-toggle {
      background: #374151;
    }
    .btn-toggle:hover { background: #4b5563; }

    #info-panel {
      padding: 10px 20px;
      background: #1f2937;
      color: #f3f4f6;
      font-size: 14px;
      border-top: 1px solid #374151;
    }

    #map { flex: 1; width: 100%; background: #0f172a; }

    /* Estilo de etiquetas de letras en el mapa */
    .node-label {
      background: transparent;
      border: none;
      box-shadow: none;
      font-weight: bold;
      color: #3b82f6;
      font-size: 13px;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
    }
  </style>
</head>
<body>

  <div id="header">
    <h3 style="margin: 0; font-size: 18px;">Voronoi SASMEX</h3>
    <input type="text" id="search-input" placeholder="Busca un lugar, edificio o ciudad (ej. Zócalo Oaxaca, Tehuacán...)">
    <button onclick="buscarLugar()">Buscar</button>
    <button class="btn-toggle" onclick="cambiarCapaMapa()">Cambiar Fondo Google</button>
  </div>

  <div id="info-panel">
    <span id="resultado">🔍 Ingresa una ubicación o edificio para encontrar el sensor sísmico más cercano.</span>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS y Turf.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

  <script>
    // 1. Inicializar el mapa
    const map = L.map('map').setView([17.2, -96.8], 7);

    // 2. Capas de Google Maps directa (Gratis sin API Key)
    const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    });

    // Cargar capa satelital híbrida por defecto
    googleHybrid.addTo(map);
    let capaActual = 'hybrid';

    function cambiarCapaMapa() {
      if (capaActual === 'hybrid') {
        map.removeLayer(googleHybrid);
        googleStreets.addTo(map);
        capaActual = 'streets';
      } else {
        map.removeLayer(googleStreets);
        googleHybrid.addTo(map);
        capaActual = 'hybrid';
      }
    }

    // 3. Puntos exactos del Voronoi que te gustó
    const puntosSensores = [
      { id: "K", label: "CH27", lat: 18.52, lng: -97.28 },
      { id: "H", label: "TM25", lat: 18.72, lng: -96.25 },
      { id: "G", label: "CO25", lat: 18.28, lng: -95.95 },
      { id: "I", label: "VH22", lat: 18.25, lng: -97.55 },
      { id: "D", label: "YC28", lat: 17.92, lng: -97.42 },
      { id: "E", label: "TC23", lat: 17.68, lng: -97.22 },
      { id: "F", label: "C24ROT", lat: 17.85, lng: -96.45 },
      { id: "M", label: "EV21", lat: 17.55, lng: -98.32 },
      { id: "C", label: "VH22-S", lat: 17.82, lng: -98.12 },
      { id: "N", label: "MQ11", lat: 16.78, lng: -99.45 },
      { id: "O", label: "MT02", lat: 16.58, lng: -98.65 },
      { id: "Q", label: "LG01", lat: 16.42, lng: -98.50 },
      { id: "P", label: "LA03", lat: 16.52, lng: -98.15 },
      { id: "R", label: "PG28", lat: 16.38, lng: -97.85 },
      { id: "S", label: "TJ16", lat: 16.28, lng: -97.50 },
      { id: "T", label: "HZ04", lat: 16.02, lng: -97.30 },
      { id: "U", label: "TU05", lat: 15.90, lng: -97.10 },
      { id: "V", label: "MX07", lat: 15.80, lng: -96.55 },
      { id: "A1", label: "TN06", lat: 15.72, lng: -96.32 },
      { id: "B1", label: "PA09", lat: 15.65, lng: -96.15 },
      { id: "W", label: "TG10", lat: 15.80, lng: -95.92 },
      { id: "X", label: "HM11", lat: 15.88, lng: -95.68 },
      { id: "Y", label: "OX29", lat: 17.08, lng: -96.72 },
      { id: "Z", label: "SI37", lat: 17.15, lng: -96.85 },
      { id: "A", label: "TA32", lat: 17.00, lng: -96.48 },
      { id: "B", label: "GX18", lat: 16.52, lng: -96.60 },
      { id: "C1", label: "SV17", lat: 16.30, lng: -96.80 },
      { id: "D1", label: "LR14", lat: 16.55, lng: -95.82 },
      { id: "E1", label: "LC34", lat: 16.80, lng: -95.35 },
      { id: "F1", label: "MA35", lat: 16.50, lng: -94.82 },
      { id: "G1", label: "PS36", lat: 16.82, lng: -94.95 },
      { id: "H1", label: "CS33", lat: 17.72, lng: -95.12 }
    ];

    // 4. Crear Voronoi con Turf.js
    const pointsGeoJSON = turf.featureCollection(
      puntosSensores.map(p => turf.point([p.lng, p.lat], { id: p.id, label: p.label }))
    );

    const bbox = [-101.5, 14.5, -93.5, 20.5];
    const voronoiPolygons = turf.voronoi(pointsGeoJSON, { bbox: bbox });

    // Dibujar celdas
    L.geoJSON(voronoiPolygons, {
      style: {
        color: '#ffffff',
        weight: 1.8,
        fillColor: '#2563eb',
        fillOpacity: 0.15
      }
    }).addTo(map);

    // Dibujar nodos azules con letras
    puntosSensores.forEach(p => {
      L.circleMarker([p.lat, p.lng], {
        radius: 5,
        color: '#ffffff',
        weight: 1.5,
        fillColor: '#2563eb',
        fillOpacity: 1
      }).addTo(map).bindPopup(`<b>Punto ${p.id}</b><br>Sensor: ${p.label}`);

      L.tooltip({
        permanent: true,
        direction: 'right',
        className: 'node-label',
        offset: [6, -2]
      })
      .setContent(p.id)
      .setLatLng([p.lat, p.lng])
      .addTo(map);
    });

    let userMarker = null;

    // 5. Buscador de Lugares / Edificios
    async function buscarLugar() {
      const query = document.getElementById('search-input').value;
      if (!query) return;

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Mexico')}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.length === 0) {
          alert("No se encontró el lugar buscado.");
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);
        const searchPoint = turf.point([lng, lat]);

        map.setView([lat, lng], 12);

        if (userMarker) map.removeLayer(userMarker);

        userMarker = L.marker([lat, lng]).addTo(map)
          .bindPopup(`<b>Ubicación:</b><br>${data[0].display_name}`)
          .openPopup();

        const nearest = turf.nearestPoint(searchPoint, pointsGeoJSON);
        const distKm = turf.distance(searchPoint, nearest, { units: 'kilometers' }).toFixed(2);

        document.getElementById('resultado').innerHTML = 
          `📍 <b>Lugar:</b> ${data[0].display_name.split(',')[0]} | 🎯 <b>Sensor más cercano:</b> Punto ${nearest.properties.id} (${nearest.properties.label}) | 📏 <b>Distancia:</b> ${distKm} km`;

      } catch (err) {
        console.error(err);
        alert("Error al buscar la ubicación.");
      }
    }
  </script>
</body>
</html>
